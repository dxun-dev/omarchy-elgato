name: Deploy website to GitHub Pages

on:
  push:
    branches: [site]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Repository identity survives renames and differs in every fork.
    if: >-
      github.repository_id == '1400619254' &&
      !github.event.repository.fork &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    if: >-
      github.repository_id == '1400619254' &&
      !github.event.repository.fork &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/site'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
